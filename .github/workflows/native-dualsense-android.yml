name: Personal Development Testing - Artemis-Android-ARM64
run-name: "UNOFFICIAL personal development/testing - Artemis-Android-ARM64 #${{ github.run_number }}"
on:
  workflow_dispatch:
  push:
    branches: [feature/native-dualsense-adaptive]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Verify quality policy
        run: bash tools/test-native-feedback.sh
      - name: Build ARM64 preview
        run: bash gradlew -Pandroid.injected.build.abi=arm64-v8a assembleNonRoot_gameDebug
      - name: Report existing upstream lint issues
        continue-on-error: true
        run: bash gradlew -Pandroid.injected.build.abi=arm64-v8a lintNonRoot_gameDebug
      - name: Describe personal development/testing build
        shell: bash
        run: |
          cat > PERSONAL_BUILD_INFO.md <<'NOTICE'
          # UNOFFICIAL PERSONAL DEVELOPMENT / TESTING PREVIEW

          Maintained by R3VALATiON. This is an independent experimental fork, not an official release of the original or Extended upstream project. No upstream affiliation or endorsement is implied.

          This artifact may contain incomplete or hardware-unverified features. The successful CI checks apply only to this source revision; they do not establish physical-controller or driver compatibility.

          Repository: ${{ github.repository }}
          Revision: ${{ github.sha }}
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          NOTICE
          cat PERSONAL_BUILD_INFO.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: UNOFFICIAL-Personal-Development-Testing-Artemis-Android-ARM64
          path: |
            app/build/**/app-nonRoot_game-arm64-v8a-debug.apk
            BUILD_NOTICE.md
            BUILD_NOTES.md
            PERSONAL_BUILD_INFO.md
          if-no-files-found: error
